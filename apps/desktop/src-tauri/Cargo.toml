[package]
name = "art-stock"
version = "0.0.1"
description = "Art Stock desktop/Pad host. Protocol stays in packages/core."
authors = ["Art Stock"]
edition = "2021"
publish = false

[lib]
name = "art_stock_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "art-stock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
